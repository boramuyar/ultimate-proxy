# ${VAR} references are expanded from the environment.
listen: ":8080"

# Postgres for keys and usage. Leave empty to keep everything in memory (dev only).
database_url: "${DATABASE_URL}"

# Who may use /admin and the dashboard. With no token and no OIDC, the admin
# API is disabled.
admin:
  # Break-glass bearer token, for scripts and for when the identity provider
  # is down. Leave empty to turn it off.
  token: "${PROXY_ADMIN_TOKEN}"
  # Signs session cookies. When empty, sessions end on restart.
  session_secret: "${ADMIN_SESSION_SECRET}"
  session_ttl: 12h
  # Sign in with any OpenID Connect provider. Off while issuer is empty.
  oidc:
    issuer: "${OIDC_ISSUER}"               # e.g. https://accounts.google.com
    client_id: "${OIDC_CLIENT_ID}"
    client_secret: "${OIDC_CLIENT_SECRET}"
    redirect_url: "${OIDC_REDIRECT_URL}"   # e.g. https://proxy.example.com/admin/auth/callback
    display_name: "${OIDC_DISPLAY_NAME}"   # e.g. Google
    # scopes: [openid, email, profile]
    # Anyone matching any list may sign in. Set at least one. Entries may be
    # comma-separated, as from an environment variable.
    allowed_emails: ["${OIDC_ALLOWED_EMAILS}"]    # e.g. [you@example.com]
    allowed_domains: ["${OIDC_ALLOWED_DOMAINS}"]  # e.g. [example.com]
    allowed_groups: ["${OIDC_ALLOWED_GROUPS}"]    # e.g. [proxy-admins]
    # groups_claim: groups

providers:
  # Any upstream that speaks Open Responses (OpenAI's Responses API or a
  # compatible server). Requests and events are relayed as-is.
  - name: openai
    type: openai
    base_url: https://api.openai.com/v1
    api_key: "${OPENAI_API_KEY}"

# Client-facing model names. Clients can also send "<provider>/<model>",
# for example "openai/gpt-5".
models:
  - name: smart
    provider: openai
    upstream_model: gpt-5
  - name: fast
    provider: openai
    upstream_model: gpt-5-mini

# Model prices live in the database, not here: add them with
# POST /admin/prices (see the README).

# Problem detection. Every value below is the default.
insights:
  disabled: false
  cache_ttl: 5m               # how long the provider keeps a prefix cached
  min_cacheable_tokens: 1024  # the provider's minimum cacheable prompt
  window: 15m                 # traffic each rule looks at
  evaluate_interval: 1m
  min_requests: 20            # least traffic in the window before a rule fires
  unstable_prefix_rate: 0.3   # thresholds as a fraction of requests
  unexpected_miss_rate: 0.3
  error_rate: 0.1
  truncation_rate: 0.2
  webhook_url: ""             # JSON POST when an insight opens or resolves
  slack_webhook_url: ""       # Slack incoming webhook for the same

# Optional: tenants, applications and keys to create at startup.
bootstrap:
  - tenant: acme
    applications:
      - name: support-bot
        can_assert_users: true   # may name the end user via X-Proxy-User-Email
        keys: ["${ACME_SUPPORT_BOT_KEY}"]

usage:
  queue_size: 100000
  batch_size: 1000
  flush_interval: 250ms
