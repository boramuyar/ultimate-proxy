name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: proxy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      clickhouse:
        image: clickhouse/clickhouse-server:25.8-alpine
        env:
          CLICKHOUSE_USER: proxy
          CLICKHOUSE_PASSWORD: clickhouse
          CLICKHOUSE_DB: proxy_test
        ports: ["8123:8123"]
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8123/ping" --health-interval 2s --health-retries 30
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/proxy_test
          TEST_CLICKHOUSE_URL: http://proxy:clickhouse@localhost:8123/proxy_test
          TEST_REDIS_URL: redis://localhost:6379/0

  compliance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: proxy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: openresponses/openresponses
          ref: 92c12d96d7b61d6d15e2214daa5e9c6000ab6e1c
          path: .spec
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Open Responses compliance
        run: scripts/compliance.sh .spec
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/proxy

  compose:
    # Builds every image and checks the stack comes up and serves the dashboard.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Send demo traffic
        run: scripts/demo-traffic.sh
      - name: Check the proxy and the dashboard
        run: |
          curl -sf localhost:3000/ | grep -q '<div id="root">'
          curl -sf localhost:3000/admin/usage?group_by=application -H "Authorization: Bearer dev-admin-token" | grep -q support-bot
          curl -sf localhost:8080/v1/responses -H "Authorization: Bearer up_demo_key" \
            -d '{"model":"fake-gpt","input":"hi"}' | grep -q '"status":"completed"'
      - name: Logs
        if: failure()
        run: docker compose logs
