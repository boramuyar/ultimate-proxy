name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: proxy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      clickhouse:
        image: clickhouse/clickhouse-server:25.8-alpine
        env:
          CLICKHOUSE_USER: proxy
          CLICKHOUSE_PASSWORD: clickhouse
          CLICKHOUSE_DB: proxy_test
        ports: ["8123:8123"]
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8123/ping" --health-interval 2s --health-retries 30
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/proxy_test
          TEST_CLICKHOUSE_URL: http://proxy:clickhouse@localhost:8123/proxy_test
          TEST_REDIS_URL: redis://localhost:6379/0

  counters:
    # The rate limit counters against the other servers redis_url accepts.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [redis:7.0-alpine, docker.dragonflydb.io/dragonflydb/dragonfly:v2.0.0]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Start ${{ matrix.image }}
        run: |
          docker run -d --name counters -p 6379:6379 --ulimit memlock=-1 "${{ matrix.image }}"
          for i in $(seq 30); do
            if exec 3<>/dev/tcp/localhost/6379 && printf 'PING\r\n' >&3 && read -t 2 r <&3 && [[ $r == +PONG* ]]; then exit 0; fi
            sleep 1
          done
          docker logs counters; exit 1
      - name: Test
        run: |
          go test -race -count=1 -v ./internal/limits/ | tee out.txt
          grep -q -- '--- PASS: TestRedisSharedAcrossEngines' out.txt
        env:
          TEST_REDIS_URL: redis://localhost:6379/0

  compliance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: proxy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: openresponses/openresponses
          ref: 92c12d96d7b61d6d15e2214daa5e9c6000ab6e1c
          path: .spec
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - name: Open Responses compliance
        run: scripts/compliance.sh .spec
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/proxy

  compose:
    # Builds every image and checks the stack comes up and serves the dashboard.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Send demo traffic
        run: scripts/demo-traffic.sh
      - name: Check the proxy and the dashboard
        run: |
          curl -sf localhost:3000/ | grep -q '<div id="root">'
          curl -sf localhost:3000/admin/usage?group_by=application -H "Authorization: Bearer dev-admin-token" | grep -q support-bot
          curl -sf localhost:8080/fake/v1/responses -H "Authorization: Bearer op_demo_key" \
            -d '{"model":"gpt-fake","input":"hi"}' | grep -q '"status":"completed"'
          curl -sf localhost:8080/fake/v1/chat/completions -H "Authorization: Bearer op_demo_key" \
            -d '{"model":"gpt-fake","messages":[{"role":"user","content":"hi"}]}' | grep -q '"finish_reason":"stop"'
      - name: Logs
        if: failure()
        run: docker compose logs

  shared-databases:
    # The stores as a least-privilege user on servers shared with other data,
    # as when reusing a company's own Postgres and ClickHouse: one schema the
    # user owns in a database it cannot create in, and one ClickHouse
    # database made for it, with no CREATE DATABASE grant. Postgres 13 and
    # ClickHouse 24.8 are the oldest versions supported.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: company
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      clickhouse:
        image: clickhouse/clickhouse-server:24.8-alpine
        env:
          CLICKHOUSE_USER: admin
          CLICKHOUSE_PASSWORD: admin
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["8123:8123"]
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8123/ping" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Create least-privilege users
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d company -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE public.billing (id int);
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          CREATE ROLE proxy LOGIN PASSWORD 'proxy';
          CREATE SCHEMA proxy AUTHORIZATION proxy;
          SQL
          for q in "CREATE DATABASE proxy" "CREATE USER proxy IDENTIFIED BY 'proxy'" \
            "GRANT SELECT, INSERT, ALTER, CREATE TABLE, CREATE VIEW, DROP VIEW, TRUNCATE ON proxy.* TO proxy"; do
            curl -fsS -u admin:admin http://localhost:8123/ --data-binary "$q"
          done
      - name: Test
        run: go test -race -count=1 ./internal/store/
        env:
          TEST_DATABASE_URL: postgres://proxy:proxy@localhost:5432/company?search_path=proxy
          TEST_CLICKHOUSE_URL: http://proxy:proxy@localhost:8123/proxy
