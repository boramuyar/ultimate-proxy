# Config for CI and local testing against the fake upstream (cmd/fake-upstream).
listen: ":8080"
database_url: "${DATABASE_URL}"
admin_token: "admin-test-token"

providers:
  - name: fake
    base_url: http://localhost:9090/v1
    api_key: fake-key

bootstrap:
  - tenant: ci
    applications:
      - name: compliance
        keys: ["op_ci_test_key"]
