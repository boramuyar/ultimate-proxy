# Proxy config for the docker compose stack (docker-compose.yml at the repo
# root). ${VAR}s come from .env next to docker-compose.yml.
listen: ":8080"
database_url: "${DATABASE_URL}"
# The request log (every request's usage) goes to ClickHouse.
clickhouse_url: "${CLICKHOUSE_URL}"
# Rate limit counters, shared by every proxy replica.
redis_url: "${REDIS_URL}"

# Who may use the dashboard and /admin. See "Signing in" in the README.
admin:
  # Break-glass token. Set PROXY_ADMIN_TOKEN= (empty) in .env to turn it off
  # once single sign-on works.
  token: "${PROXY_ADMIN_TOKEN}"
  session_secret: "${ADMIN_SESSION_SECRET}"
  # Single sign-on with any OpenID Connect provider; off while OIDC_ISSUER
  # is empty.
  oidc:
    issuer: "${OIDC_ISSUER}"
    client_id: "${OIDC_CLIENT_ID}"
    client_secret: "${OIDC_CLIENT_SECRET}"
    redirect_url: "${OIDC_REDIRECT_URL}"
    display_name: "${OIDC_DISPLAY_NAME}"
    scopes: ["${OIDC_SCOPES}"]
    allowed_emails: ["${OIDC_ALLOWED_EMAILS}"]
    allowed_domains: ["${OIDC_ALLOWED_DOMAINS}"]
    allowed_groups: ["${OIDC_ALLOWED_GROUPS}"]
    # Read-only access for more people. For admins of only some tenants,
    # add entries with tenants: [...] (see "Roles" in the README).
    roles:
      - role: viewer
        emails: ["${OIDC_VIEWER_EMAILS}"]
        domains: ["${OIDC_VIEWER_DOMAINS}"]
        groups: ["${OIDC_VIEWER_GROUPS}"]
    groups_claim: "${OIDC_GROUPS_CLAIM}"

# Each provider is reached at /<name>/v1/..., for example
# http://localhost:8080/fake/v1/responses. Requests pass through unchanged.
providers:
  # Free: a deterministic fake of the OpenAI API, running next to the proxy.
  # Any model name works, such as gpt-fake.
  - name: fake
    base_url: http://fake-upstream:9090/v1
    api_key: fake-key
  # Real provider. Calls to it fail until OPENAI_API_KEY is set in .env.
  - name: openai
    base_url: https://api.openai.com/v1
    api_key: "${OPENAI_API_KEY}"

bootstrap:
  - tenant: demo
    applications:
      - name: playground
        keys: ["${DEMO_APP_KEY}"]

insights:
  # Alert on smaller traffic than the production default, so the demo
  # shows insights quickly.
  min_requests: 5

# OpenTelemetry: a span per model call (model, tokens, cost, cache status;
# never the prompt or output). Off while TRACING_ENDPOINT is empty. See
# "Tracing" in the README.
tracing:
  endpoint: "${TRACING_ENDPOINT}"
  headers:
    Authorization: "${TRACING_AUTHORIZATION}"
