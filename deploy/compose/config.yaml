# Proxy config for the docker compose stack (docker-compose.yml at the repo
# root). ${VAR}s come from .env next to docker-compose.yml.
listen: ":8080"
database_url: "${DATABASE_URL}"
# The request log (every request's usage) goes to ClickHouse.
clickhouse_url: "${CLICKHOUSE_URL}"

# Who may use the dashboard and /admin. See "Signing in" in the README.
admin:
  # Break-glass token. Set PROXY_ADMIN_TOKEN= (empty) in .env to turn it off
  # once single sign-on works.
  token: "${PROXY_ADMIN_TOKEN}"
  session_secret: "${ADMIN_SESSION_SECRET}"
  # Single sign-on with any OpenID Connect provider; off while OIDC_ISSUER
  # is empty.
  oidc:
    issuer: "${OIDC_ISSUER}"
    client_id: "${OIDC_CLIENT_ID}"
    client_secret: "${OIDC_CLIENT_SECRET}"
    redirect_url: "${OIDC_REDIRECT_URL}"
    display_name: "${OIDC_DISPLAY_NAME}"
    scopes: ["${OIDC_SCOPES}"]
    allowed_emails: ["${OIDC_ALLOWED_EMAILS}"]
    allowed_domains: ["${OIDC_ALLOWED_DOMAINS}"]
    allowed_groups: ["${OIDC_ALLOWED_GROUPS}"]
    groups_claim: "${OIDC_GROUPS_CLAIM}"

providers:
  # Free: a deterministic fake of the Responses API, running next to the proxy.
  # Two replicas, so the demo shows conversations sticking to one and
  # moving when it fails.
  - name: fake-openai
    type: openai
    api_key: fake-key
    deployments:
      - {name: replica-1, base_url: http://fake-upstream:9090/v1}
      - {name: replica-2, base_url: http://fake-upstream-2:9090/v1}
  # The same fake, spoken to through Chat Completions, as for vLLM or Ollama.
  - name: fake-local
    type: chat_completions
    base_url: http://fake-upstream:9090/v1
    api_key: fake-key
  # Real provider. Calls to it fail until OPENAI_API_KEY is set in .env.
  - name: openai
    type: openai
    base_url: https://api.openai.com/v1
    api_key: "${OPENAI_API_KEY}"

models:
  - {name: fake-gpt, provider: fake-openai, upstream_model: gpt-fake, fallbacks: [fake-chat]}
  - {name: fake-chat, provider: fake-local, upstream_model: llama-fake}
  - {name: smart, provider: openai, upstream_model: gpt-5}
  - {name: fast, provider: openai, upstream_model: gpt-5-mini}

bootstrap:
  - tenant: demo
    applications:
      - name: playground
        keys: ["${DEMO_APP_KEY}"]

insights:
  # Alert on smaller traffic than the production default, so the demo
  # shows insights quickly.
  min_requests: 5
