# Local stack: proxy + Postgres. Set OPENAI_API_KEY first.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: proxy
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30
  proxy:
    build: ..
    ports: ["8080:8080"]
    volumes: ["../config.example.yaml:/etc/ultimate-proxy/config.yaml:ro"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/proxy
      PROXY_ADMIN_TOKEN: ${PROXY_ADMIN_TOKEN:-change-me}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ACME_SUPPORT_BOT_KEY: ${ACME_SUPPORT_BOT_KEY:-up_dev_key}
    depends_on:
      postgres: {condition: service_healthy}
