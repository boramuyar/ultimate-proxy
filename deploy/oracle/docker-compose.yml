# Proxy + Postgres + fake upstream, started by deploy/oracle/setup.sh.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: proxy
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30
  fake-upstream:
    build: ../..
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/fake-upstream", "-listen", ":9090", "-api-key", "fake-key"]
  proxy:
    build: ../..
    restart: unless-stopped
    ports: ["8080:8080"]
    env_file: ../../.env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/proxy
    volumes: ["./config.yaml:/etc/ultimate-proxy/config.yaml:ro"]
    depends_on:
      postgres: {condition: service_healthy}
      fake-upstream: {condition: service_started}
volumes:
  pgdata:
