# The whole stack: docker compose up -d --build
#
#   dashboard      http://localhost:3000   (sign in with SSO or PROXY_ADMIN_TOKEN)
#   proxy          http://localhost:8080   (/<provider>/v1/... and /admin)
#   postgres       internal only; tenants, keys, prices (pgdata volume)
#   clickhouse     internal only; the request log (chdata volume)
#   valkey         internal only; rate limit counters shared by proxy replicas
#   fake-upstream  internal only; a free fake OpenAI API, the "fake" provider
#
# Settings come from .env (copy .env.example). Without one, the defaults
# below are used, which are fine on your own machine but not on a server.
name: ultimate-proxy

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: proxy
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:25.8-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: proxy
      CLICKHOUSE_USER: proxy
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
    volumes: [chdata:/var/lib/clickhouse]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 2s
      retries: 30

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      retries: 30

  fake-upstream:
    build: .
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/fake-upstream", "-listen", ":9090", "-api-key", "fake-key"]

  proxy:
    build: .
    restart: unless-stopped
    ports: ["${PROXY_PORT:-8080}:8080"]
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/proxy
      CLICKHOUSE_URL: http://proxy:${CLICKHOUSE_PASSWORD:-clickhouse}@clickhouse:8123/proxy
      REDIS_URL: redis://valkey:6379/0
      # Unset means the dev default; set but empty turns the token off.
      PROXY_ADMIN_TOKEN: ${PROXY_ADMIN_TOKEN-dev-admin-token}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-http://localhost:3000/admin/auth/callback}
      OIDC_DISPLAY_NAME: ${OIDC_DISPLAY_NAME:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-}
      OIDC_ALLOWED_EMAILS: ${OIDC_ALLOWED_EMAILS:-}
      OIDC_ALLOWED_DOMAINS: ${OIDC_ALLOWED_DOMAINS:-}
      OIDC_ALLOWED_GROUPS: ${OIDC_ALLOWED_GROUPS:-}
      OIDC_VIEWER_EMAILS: ${OIDC_VIEWER_EMAILS:-}
      OIDC_VIEWER_DOMAINS: ${OIDC_VIEWER_DOMAINS:-}
      OIDC_VIEWER_GROUPS: ${OIDC_VIEWER_GROUPS:-}
      OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-}
      DEMO_APP_KEY: ${DEMO_APP_KEY:-up_demo_key}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes: ["./deploy/compose/config.yaml:/etc/ultimate-proxy/config.yaml:ro"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/ultimate-proxy", "-healthcheck", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      retries: 30
    depends_on:
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      valkey: {condition: service_healthy}
      fake-upstream: {condition: service_started}

  dashboard:
    build: ./web
    restart: unless-stopped
    ports: ["${DASHBOARD_PORT:-3000}:80"]
    environment:
      PROXY_URL: http://proxy:8080
    depends_on:
      proxy: {condition: service_healthy}

volumes:
  pgdata:
  chdata:
